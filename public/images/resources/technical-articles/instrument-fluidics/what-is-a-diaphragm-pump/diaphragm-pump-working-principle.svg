<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="1520" height="640" role="img" aria-label="隔膜泵吸入冲程与排出冲程工作原理示意图" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="dp-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="dp-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">隔膜往下拉时吸液，往上推时排液</text>
  <line x1="382" y1="64" x2="382" y2="304" stroke="#e5e7eb"/>

  <!-- 吸入冲程 -->
  <g>
    <g stroke="#9ca3af" stroke-width="1.25" fill="none">
      <line x1="34" y1="128" x2="134" y2="128"/><line x1="34" y1="148" x2="134" y2="148"/>
      <line x1="254" y1="128" x2="354" y2="128"/><line x1="254" y1="148" x2="354" y2="148"/>
      <path d="M134 128V112H254V128"/><path d="M134 148V178"/><path d="M254 148V178"/>
    </g>
    <path d="M134 178Q194 214 254 178" stroke="#2563eb" stroke-width="3" fill="none"/>
    <line x1="38" y1="138" x2="130" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#dp-flow)"/>
    <line x1="304" y1="122" x2="304" y2="154" stroke="#dc2626" stroke-width="3"/>
    <line x1="194" y1="204" x2="194" y2="242" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#dp-move)"/>
    <text x="34" y="76" font-weight="600" fill="#1f2328">① 吸入冲程</text>
    <text x="194" y="104" font-size="11.5" text-anchor="middle" fill="#6b7280">泵腔</text>
    <text x="34" y="118" font-size="11.5" fill="#6b7280">入口</text>
    <text x="354" y="118" font-size="11.5" text-anchor="end" fill="#6b7280">出口</text>
    <text x="84" y="172" font-size="11.5" text-anchor="middle" fill="#1f2328">入口阀 开</text>
    <text x="304" y="172" font-size="11.5" text-anchor="middle" fill="#1f2328">出口阀 关</text>
    <text x="194" y="276" text-anchor="middle" fill="#1f2328">隔膜下行，腔体变大，压力降低</text>
    <text x="194" y="296" font-size="11.5" text-anchor="middle" fill="#6b7280">介质从入口吸进泵腔</text>
  </g>

  <!-- 排出冲程 -->
  <g>
    <g stroke="#9ca3af" stroke-width="1.25" fill="none">
      <line x1="414" y1="128" x2="514" y2="128"/><line x1="414" y1="148" x2="514" y2="148"/>
      <line x1="634" y1="128" x2="734" y2="128"/><line x1="634" y1="148" x2="734" y2="148"/>
      <path d="M514 128V112H634V128"/><path d="M514 148V178"/><path d="M634 148V178"/>
    </g>
    <path d="M514 178Q574 150 634 178" stroke="#2563eb" stroke-width="3" fill="none"/>
    <line x1="464" y1="122" x2="464" y2="154" stroke="#dc2626" stroke-width="3"/>
    <line x1="638" y1="138" x2="730" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#dp-flow)"/>
    <line x1="574" y1="242" x2="574" y2="180" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#dp-move)"/>
    <text x="414" y="76" font-weight="600" fill="#1f2328">② 排出冲程</text>
    <text x="574" y="104" font-size="11.5" text-anchor="middle" fill="#6b7280">泵腔</text>
    <text x="414" y="118" font-size="11.5" fill="#6b7280">入口</text>
    <text x="734" y="118" font-size="11.5" text-anchor="end" fill="#6b7280">出口</text>
    <text x="464" y="172" font-size="11.5" text-anchor="middle" fill="#1f2328">入口阀 关</text>
    <text x="684" y="172" font-size="11.5" text-anchor="middle" fill="#1f2328">出口阀 开</text>
    <text x="574" y="276" text-anchor="middle" fill="#1f2328">隔膜上行，腔体变小，压力升高</text>
    <text x="574" y="296" font-size="11.5" text-anchor="middle" fill="#6b7280">介质从出口推出泵腔</text>
  </g>
</svg>
