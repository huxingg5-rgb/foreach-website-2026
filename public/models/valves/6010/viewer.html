<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>FOREACH SV10 · 3D</title><style>
:root{--brand:#173368;--accent:#09e9b4;--text:#14223b;--muted:#637087;--line:rgba(23,51,104,.1);--soft:#f8fafd}
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--text);font:14px/1.5 'Microsoft YaHei','PingFang SC',Arial,sans-serif;padding:28px 32px}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:3px}header{max-width:1440px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:center;gap:24px}h1{margin:0;font-size:22px;font-weight:600;color:var(--brand)}.model-picker{display:flex;align-items:center}select{background:white;color:var(--brand);border:1px solid var(--line);border-radius:8px;padding:10px 30px 10px 14px;cursor:pointer;max-width:100%}.tabs{max-width:1440px;margin:0 auto;display:flex;gap:28px;padding:0 24px;background:white;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}.tabs button{position:relative;border:0;background:none;color:var(--muted);padding:17px 3px;font-weight:500}.tabs button.selected{color:var(--brand);font-weight:600}.tabs button.selected:after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--accent);border-radius:3px 3px 0 0}
.viewer{max-width:1440px;height:calc(100svh - 172px);min-height:460px;margin:0 auto;background:white;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:0 0 16px 16px;box-shadow:0 12px 36px #17336806}.viewer:fullscreen,.viewer.expanded{max-width:none;width:100vw;height:100vh;margin:0;border-radius:0}.viewer.expanded{position:fixed;inset:0;z-index:100}.topbar{position:absolute;right:22px;top:18px;z-index:5;pointer-events:none}.tools{display:flex;align-items:center;gap:6px;pointer-events:auto;background:#ffffffef;border:1px solid var(--line);padding:4px;border-radius:10px}.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:var(--muted)}.iconbtn:hover{background:#f0f4f8;color:var(--brand)}.iconbtn.active{background:var(--brand);color:var(--accent)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linejoin:round;stroke-linecap:round}.toolselect{border:0;background:transparent;max-width:108px;color:var(--brand);padding:8px 20px 8px 4px;font-size:12px}.toolgroup{display:flex;align-items:center}.toolgroup svg{width:21px;color:var(--muted)}.divider{height:20px;width:1px;background:var(--line);margin:0 3px}.side-tools{position:absolute;left:22px;top:18px;display:flex;gap:5px;padding:4px;background:#ffffffef;border:1px solid var(--line);border-radius:10px;z-index:6}.stage{position:absolute;inset:0;touch-action:none}.stage canvas{display:block;width:100%;height:100%;outline:none}.panel{position:absolute;background:#fffffff5;border:1px solid var(--line);box-shadow:0 10px 30px #1733680d;border-radius:12px;padding:18px;z-index:8}.panel h2{font-size:14px;color:var(--brand);margin:0 0 14px;font-weight:600}.tree-panel{left:22px;top:74px;width:240px;max-height:65%;overflow:auto}.tree-root{font-size:12px;color:var(--muted);margin:8px 0 10px;word-break:break-all}.part{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:12px;word-break:break-all}.part input{accent-color:var(--brand)}.subtle{font-size:11px;color:var(--muted);margin-top:12px}.section-panel{left:22px;top:74px;width:250px}.section-panel select{padding:4px;margin-right:10px}.section-panel input{width:100%;accent-color:var(--brand);margin-top:16px}.help-panel{right:22px;top:74px;width:286px}.help-panel p{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}.help-panel strong{font-weight:500;color:var(--text)}.help-close{position:absolute;right:8px;top:8px;width:24px;height:24px}.help-close svg{width:18px}.drawing-wrap{position:absolute;inset:24px;overflow:auto;text-align:center}.drawing-wrap img{height:100%;width:auto;max-width:100%;object-fit:contain}
.dimension-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden;fill:none}.dimension-line{stroke:#000;stroke-width:1.2}.dimension-extension{stroke:#000;stroke-width:1;stroke-dasharray:3 3}.dimension-label{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#000;stroke:white;stroke-width:5px;paint-order:stroke;stroke-linejoin:round}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
@media(max-width:800px){body{padding:20px 16px}header{margin-bottom:16px}h1{font-size:18px}.tools{gap:2px}.toolgroup svg{display:none}.topbar{right:14px;top:14px}.side-tools{left:14px;top:14px}.toolselect{max-width:87px}.viewer{height:calc(100svh - 148px)}}
@media(max-width:600px){body{padding:16px 12px}header{align-items:flex-start;gap:12px;flex-direction:column}header select{padding:8px 28px 8px 10px;font-size:12px}.tabs{padding:0 16px;gap:24px}.tabs button{padding:13px 2px}.viewer{height:calc(100svh - 188px);min-height:440px}.side-tools{top:12px;left:12px}.topbar{left:12px;right:auto;top:65px}.tools{gap:1px}.iconbtn{width:32px;height:32px}.toolselect{max-width:82px;font-size:11px;padding-right:15px}.divider{margin:0 1px}.help-panel{right:12px;top:112px}.tree-panel,.section-panel{left:12px;top:112px}.dimension-label{font-size:11px}}
body{padding:0!important;background:#fff}.topbar,.side-tools{top:0}.stage{top:48px}header,.tabs{display:none}.viewer{max-width:none;width:100%;height:100svh!important;min-height:0!important;border:0;border-radius:0;box-shadow:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;z-index:12;color:var(--brand)}.loading button{padding:12px 18px;border:1px solid var(--line);border-radius:8px;background:var(--brand);color:#fff}
@media(max-width:600px){.side-tools{top:0}.topbar{top:53px}.stage{top:133px}}
@media(max-width:420px){.tools{flex-wrap:wrap;max-width:calc(100vw - 24px)}.iconbtn{width:30px}.toolselect{max-width:76px}}
</style></head><body>
<header><h1>6010 系列电磁阀</h1><label class="model-picker"><select id="models" aria-label="选择型号"></select></label></header>
<div class="tabs" role="tablist"><button id="tab2d" role="tab" aria-selected="false">2D 图纸</button><button id="tab3d" class="selected" role="tab" aria-selected="true">3D 模型</button></div>
<main id="viewer" class="viewer"><div id="loading" class="loading" role="status">…</div><div id="stage" class="stage"></div><div class="topbar"><div id="tools" class="tools">
<button id="home" class="iconbtn" aria-label="复位" title="复位 · Home" data-icon="home"></button><button id="play" class="iconbtn" aria-label="自动旋转" aria-pressed="false" title="自动旋转" data-icon="play"></button><button id="fit" class="iconbtn" aria-label="适应窗口" title="适应窗口" data-icon="fit"></button><span class="divider"></span>
<label class="toolgroup"><span data-icon="view"></span><select id="views" class="toolselect" aria-label="观察视角"><option value="iso">等轴测</option><option value="front">正视图</option><option value="back">后视图</option><option value="right">右视图</option><option value="left">左视图</option><option value="top">俯视图</option><option value="bottom">仰视图</option></select></label>
<label class="toolgroup"><span data-icon="cube"></span><select id="display" class="toolselect" aria-label="显示样式"><option value="edges">带边线</option><option value="solid">实体</option><option value="wire">线框</option><option value="transparent" hidden>透明</option></select></label><span class="divider"></span><button id="help" class="iconbtn" aria-label="操作帮助" title="操作帮助" data-icon="help"></button><button id="full" class="iconbtn" aria-label="全屏" title="全屏" data-icon="full"></button>
</div></div>
<div id="side-tools" class="side-tools"><button id="dimensions" class="iconbtn active" aria-label="外形尺寸（不含电线）" aria-pressed="true" title="外形尺寸（不含电线）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v10H3zM7 7v5m5-5v3m5-3v5"/></svg></button><button id="tree" class="iconbtn" aria-label="模型结构" title="模型结构" data-icon="tree"></button><button id="section" class="iconbtn" aria-label="剖切" title="剖切" data-icon="section"></button></div>
<aside id="tree-panel" class="panel tree-panel" hidden><h2>模型结构</h2><div id="tree-content"></div></aside>
<aside id="section-panel" class="panel section-panel" hidden><h2>剖切视图</h2><label>方向 <select id="section-axis" aria-label="剖切方向"><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select></label><input id="section-range" aria-label="剖切位置" type="range" min="0" max="100" value="50"><div class="subtle">移动滑块查看内部 · 切口不封面</div></aside>
<aside id="help-panel" class="panel help-panel" hidden><h2>操作说明</h2><button id="help-close" class="iconbtn help-close" aria-label="关闭帮助" data-icon="close"></button><p><strong>旋转模型</strong><span>左键拖动 / 单指拖动</span></p><p><strong>缩放</strong><span>滚轮 / 双指缩放</span></p><p><strong>平移</strong><span>右键拖动 / 双指拖动</span></p><p><strong>复位</strong><span>Home</span></p><p class="subtle">尺寸按模型测量，不含电线。</p></aside>
<div id="drawing-wrap" class="drawing-wrap" hidden><img id="drawing" alt="二维图纸"></div><span id="status" class="sr-only" role="status"></span></main>

<script src="./viewer.js"></script></body></html>
