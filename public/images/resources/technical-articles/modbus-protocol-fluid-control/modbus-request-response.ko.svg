tart" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">단일 레지스터 쓰기</tspan></text><rect x="620" y="760" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="702" y1="760" x2="702" y2="848" stroke="#b6c4d3"/><text x="661" y="814" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">0F</tspan></text><text x="720" y="813" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">여러 코일 쓰기</tspan></text><rect x="620" y="848" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="702" y1="848" x2="702" y2="936" stroke="#b6c4d3"/><text x="661" y="902" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">10</tspan></text><text x="720" y="901" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">여러 레지스터 쓰기</tspan></text><text x="600" y="984" text-anchor="middle" fill="#5b6d81" font-size="20" font-weight="400"><tspan x="600" dy="0">RTU: CRC  •  ASCII: LRC  •  지원 기능은 장치에 따라 다릅니다.</tspan></text></g></svg>
