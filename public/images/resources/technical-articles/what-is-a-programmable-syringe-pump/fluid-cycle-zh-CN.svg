<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" xml:lang="zh-CN">
<title>吸液和排液两个阶段中液源、选路阀、注射器与目标容器的流向示意</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#202020"/></marker></defs><rect width="800" height="540" fill="white"/>
<g font-family="Arial, Microsoft YaHei, Malgun Gothic, sans-serif" fill="#181818"><path d="M400 20V465" stroke="#bbb"/>
<text x="200" y="46" text-anchor="middle" font-size="36" font-weight="bold">01  吸液</text>
<text x="200" y="82" text-anchor="middle" font-size="26">液源 → 注射器</text>
<rect x="35" y="110" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="157" text-anchor="middle" font-size="34">液源</text>
<path d="M200 193V227" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="242" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="289" text-anchor="middle" font-size="34">选路阀</text>
<path d="M200 325V359" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="374" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="421" text-anchor="middle" font-size="34">注射器</text>
<text x="600" y="46" text-anchor="middle" font-size="36" font-weight="bold">02  排液</text>
<text x="600" y="82" text-anchor="middle" font-size="26">注射器 → 目标容器</text>
<rect x="435" y="110" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="600" y="157" text-anchor="middle" font-size="34">注射器</text>
<path d="M600 193V227" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="435" y="242" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="600" y="289" text-anchor="middle" font-size="34">选路阀</text>
<path d="M600 325V359" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="435" y="374" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="600" y="421" text-anchor="middle" font-size="34">目标容器</text>
<path d="M35 480H765" stroke="#bbb"/><text x="400" y="520" text-anchor="middle" font-size="30">先建立通路，再执行计量运动</text></g></svg>