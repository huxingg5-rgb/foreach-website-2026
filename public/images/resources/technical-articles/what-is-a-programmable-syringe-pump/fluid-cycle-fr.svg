<g font-family="Arial, Microsoft YaHei, Malgun Gothic, sans-serif" fill="#181818"><path d="M400 20V465" stroke="#bbb"/>
<text x="200" y="46" text-anchor="middle" font-size="36" font-weight="bold">01  Aspirer</text>
<text x="200" y="82" text-anchor="middle" font-size="26">Source → seringue</text>
<rect x="35" y="110" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="157" text-anchor="middle" font-size="34">Source</text>
