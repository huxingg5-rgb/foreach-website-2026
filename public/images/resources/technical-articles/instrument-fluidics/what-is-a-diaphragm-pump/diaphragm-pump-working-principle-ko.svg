<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="1520" height="640" role="img" aria-label="다이어프램 펌프의 흡입 행정과 토출 행정 작동 원리도" font-family="&#x27;Malgun Gothic&#x27;,&#x27;Apple SD Gothic Neo&#x27;,&#x27;Noto Sans KR&#x27;,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="dp-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="dp-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">다이어프램이 내려가면 흡입, 올라가면 토출</text>
  <line x1="382" y1="64" x2="382" y2="304" stroke="#e5e7eb"/>

  <!-- suction stroke -->
  <g>
    <g stroke="#9ca3af" stroke-width="1.25" fill="none">
      <line x1="34" y1="128" x2="134" y2="128"/><line x1="34" y1="148" x2="134" y2="148"/>
      <line x1="254" y1="128" x2="354" y2="128"/><line x1="254" y1="148" x2="354" y2="148"/>
      <path d="M134 128V112H254V128"/><path d="M134 148V178"/><path d="M254 148V178"/>
    </g>
    <path d="M134 178Q194 214 254 178" stroke="#2563eb" stroke-width="3" fill="none"/>
    <line x1="38" y1="138" x2="130" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#dp-flow)"/>
    <line x1="304" y1="122" x2="304" y2="154" stroke="#dc2626" stroke-width="3"/>
    <line x1="194" y1="204" x2="194" y2="242" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#dp-move)"/>
    <text x="34" y="76" font-weight="600" fill="#1f2328">① 흡입 행정</text>
    <text x="194" y="104" font-size="11.5" text-anchor="middle" fill="#6b7280">펌프 챔버</text>
    <text x="34" y="118" font-size="11.5" fill="#6b7280">입구</text>
    <text x="354" y="118" font-size="11.5" text-anchor="end" fill="#6b7280">출구</text>
    <text x="84" y="168" font-size="11.5" text-anchor="middle" fill="#1f2328"><tspan x="84">입구 밸브</tspan><tspan x="84" dy="1.3em">열림</tspan></text>
    <text x="304" y="168" font-size="11.5" text-anchor="middle" fill="#1f2328"><tspan x="304">출구 밸브</tspan><tspan x="304" dy="1.3em">닫힘</tspan></text>
    <text x="194" y="276" font-size="13" text-anchor="middle" fill="#1f2328">다이어프램 하강, 체적 증가, 압력 저하</text>
    <text x="194" y="296" font-size="11.5" text-anchor="middle" fill="#6b7280">유체가 입구로 흡입됨</text>
  </g>

  <!-- discharge stroke -->
  <g>
    <g stroke="#9ca3af" stroke-width="1.25" fill="none">
      <line x1="414" y1="128" x2="514" y2="128"/><line x1="414" y1="148" x2="514" y2="148"/>
      <line x1="634" y1="128" x2="734" y2="128"/><line x1="634" y1="148" x2="734" y2="148"/>
      <path d="M514 128V112H634V128"/><path d="M514 148V178"/><path d="M634 148V178"/>
    </g>
    <path d="M514 178Q574 150 634 178" stroke="#2563eb" stroke-width="3" fill="none"/>
    <line x1="464" y1="122" x2="464" y2="154" stroke="#dc2626" stroke-width="3"/>
    <line x1="638" y1="138" x2="730" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#dp-flow)"/>
    <line x1="574" y1="242" x2="574" y2="180" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#dp-move)"/>
    <text x="414" y="76" font-weight="600" fill="#1f2328">② 토출 행정</text>
    <text x="574" y="104" font-size="11.5" text-anchor="middle" fill="#6b7280">펌프 챔버</text>
    <text x="414" y="118" font-size="11.5" fill="#6b7280">입구</text>
    <text x="734" y="118" font-size="11.5" text-anchor="end" fill="#6b7280">출구</text>
    <text x="464" y="168" font-size="11.5" text-anchor="middle" fill="#1f2328"><tspan x="464">입구 밸브</tspan><tspan x="464" dy="1.3em">닫힘</tspan></text>
    <text x="684" y="168" font-size="11.5" text-anchor="middle" fill="#1f2328"><tspan x="684">출구 밸브</tspan><tspan x="684" dy="1.3em">열림</tspan></text>
    <text x="574" y="276" font-size="13" text-anchor="middle" fill="#1f2328">다이어프램 상승, 체적 감소, 압력 상승</text>
    <text x="574" y="296" font-size="11.5" text-anchor="middle" fill="#6b7280">유체가 출구로 토출됨</text>
  </g>
</svg>
