<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SM-500 压缩效果对比</title><style>
:root{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:#173368;background:#f3f6f9}*{box-sizing:border-box}body{margin:0;padding:28px 32px}main{max-width:1680px;margin:auto}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:#64758b}h1{margin:8px 0 10px;font-size:28px;font-weight:650}.intro{margin:0;color:#5c6b7f;line-height:1.7}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.saving{background:#d8faef;color:#116949;border:1px solid #b7e9d8;border-radius:14px;padding:15px 24px;white-space:nowrap}.saving strong{font-size:26px;display:block}.saving span{font-size:12px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:24px 0 16px}.toolbar button{border:1px solid #d5dfea;border-radius:8px;background:#fff;color:#173368;padding:9px 14px;font:inherit;font-size:13px;cursor:pointer}.toolbar button[aria-pressed=true]{background:#173368;color:#fff;border-color:#173368}.toolbar button:hover{border-color:#173368}.toolbar label{display:flex;align-items:center;gap:7px;font-size:13px;margin-left:12px}.toolbar input{accent-color:#173368}.toolbar .gap{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{min-width:0;background:#fff;border:1px solid #dce3eb;border-radius:14px;overflow:hidden;box-shadow:0 6px 22px #17336805}.panel-head{padding:18px 22px;border-bottom:1px solid #e8edf3;display:flex;justify-content:space-between;align-items:center;gap:16px}.label{font-size:16px;font-weight:700}.label small{display:block;font-size:12px;font-weight:400;color:#6b7b91;margin-top:4px}.size{font-size:25px;font-weight:700;white-space:nowrap}.compact .size{color:#168565}.viewerbox{height:clamp(440px,66svh,780px);position:relative;background:#fff}.viewerbox iframe{border:0;display:block;width:100%;height:100%}.status{display:flex;align-items:center;gap:7px;font-size:12px;color:#6b7b91;padding:12px 22px;border-top:1px solid #eef1f5}.dot{height:7px;width:7px;border-radius:50%;background:#a2b1c5}.status[data-state=ready] .dot{background:#0db887}.status[data-state=error] .dot{background:#da564d}.notes{margin-top:15px;font-size:13px;color:#637389;line-height:1.8}.notes strong{color:#173368;font-weight:600}a{color:#173368}.foot{font-size:12px;color:#8290a3;margin-top:6px}@media(max-width:800px){body{padding:18px 12px}.top{align-items:flex-start}.saving{padding:11px 12px}.saving strong{font-size:21px}h1{font-size:22px}.grid{grid-template-columns:1fr}.viewerbox{height:65svh;min-height:440px}.toolbar .gap{display:none}.panel-head{padding:14px 16px}.size{font-size:22px}}
</style></head><body><main><div class="top"><div><div class="eyebrow">单型号测试 · SM-500 PMMA</div><h1>压缩前后，直接对比</h1><p class="intro">左右为同一模型、同一视角。拖动旋转或滚轮缩放，左右画面同步。</p></div><div class="saving"><strong>减少 89.2%</strong><span>模型 11.36 MB → 1.22 MB</span></div></div>
<div class="toolbar" aria-label="对比工具"><button data-view="iso" aria-pressed="true">等轴测</button><button data-view="front" aria-pressed="false">正面</button><button data-view="back" aria-pressed="false">背面</button><button data-view="right" aria-pressed="false">右侧</button><button data-view="top" aria-pressed="false">俯视</button><button data-view="bottom" aria-pressed="false">底部</button><span class="gap"></span><button id="zoom-in">放大细节</button><button id="zoom-out">缩小</button><button id="reset">复位</button><label><input id="dimensions" type="checkbox" checked>尺寸</label><label><input id="edges" type="checkbox" checked>边线</label></div>
<div class="grid"><section class="panel"><div class="panel-head"><div class="label">原版<small>当前网站使用的模型</small></div><div class="size">11.36 MB</div></div><div class="viewerbox"><iframe id="original" src="./viewer.html?model=sm-500&head=pmma&lang=zh&version=original" title="SM-500 原版"></iframe></div><div class="status" id="original-status" data-state="loading"><span class="dot"></span><span>加载中</span></div></section>
<section class="panel compact"><div class="panel-head"><div class="label">压缩测试版<small>保留全部零件与三角面</small></div><div class="size">1.22 MB</div></div><div class="viewerbox"><iframe id="compact" src="./viewer.html?model=sm-500&head=pmma&lang=zh&version=compact" title="SM-500 压缩测试版"></iframe></div><div class="status" id="compact-status" data-state="loading"><span class="dot"></span><span>加载中</span></div></section></div>
<p class="notes"><strong>本次只改变数据存储方式。</strong> 对比重点：透明泵头、金属反光、圆孔、边缘轮廓与底部细节。原版文件和正式产品页保持原样。</p><p class="foot">文件体积按 1 MB = 1,000,000 字节计算；仅为本地单型号测试。</p></main><script>
const frames=[document.getElementById('original'),document.getElementById('compact')];
const send=data=>frames.forEach(f=>f.contentWindow.postMessage({type:'comparison-control',...data},location.origin));
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;const i=frames.findIndex(f=>f.contentWindow===event.source);if(i<0)return;
if(event.data?.type==='comparison-camera'){frames[1-i].contentWindow.postMessage(event.data,location.origin)}
if(event.data?.type==='comparison-ready'){const status=document.getElementById(frames[i].id+'-status');status.dataset.state='ready';status.lastElementChild.textContent='模型已显示 · 可旋转、缩放';frames[i].contentWindow.postMessage({type:'comparison-control',dimensions:document.getElementById('dimensions').checked,edges:document.getElementById('edges').checked},location.origin)}
if(event.data?.type==='comparison-error'){const status=document.getElementById(frames[i].id+'-status');status.dataset.state='error';status.lastElementChild.textContent='加载失败，请刷新页面'}
});
const views=[...document.querySelectorAll('[data-view]')];function changeView(view){send({view});views.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)))}views.forEach(b=>b.onclick=()=>changeView(b.dataset.view));
document.getElementById('zoom-in').onclick=()=>send({zoom:1.5});document.getElementById('zoom-out').onclick=()=>send({zoom:1/1.5});document.getElementById('reset').onclick=()=>changeView('iso');
document.getElementById('dimensions').onchange=e=>send({dimensions:e.target.checked});document.getElementById('edges').onchange=e=>send({edges:e.target.checked});
</script></body></html>
