<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img"><rect width="1440" height="820" fill="#f4f8fb"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#126c83" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#173368">
<text x="65" y="78" font-size="38" font-weight="700">化学发光分析仪：按液路任务选隔膜泵</text><text x="65" y="125" font-size="23" fill="#566b80">依据所提供液路图归纳；不是原图接线、阀口或动作时序的替代图。</text>
<g font-size="27"><rect x="65" y="185" width="1310" height="175" rx="14" fill="white"/><text x="95" y="230" fill="#126c83">01 清洗供液</text><text x="95" y="285">清洗液容器</text><path d="M290 275H400" stroke="#126c83" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="285">供液泵与管路部件</text><path d="M710 275H805" stroke="#126c83" stroke-width="3" marker-end="url(#arrow)"/><text x="835" y="285">清洗使用端</text><text x="95" y="330" font-size="23" fill="#566b80">核对：单次液量、供液时间、实际阻力、材料相容性</text>
<rect x="65" y="385" width="1310" height="175" rx="14" fill="white"/><text x="95" y="430" fill="#126c83">02 吸废液与排空</text><text x="95" y="485">吸废液针</text><path d="M290 475H400" stroke="#126c83" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="485">适用排废工况的泵</text><path d="M710 475H805" stroke="#126c83" stroke-width="3" marker-end="url(#arrow)"/><text x="835" y="485">废液收集端</text><text x="95" y="530" font-size="23" fill="#566b80">核对：气液交替、排空时间、恢复能力、残液与背压</text>
<rect x="65" y="585" width="1310" height="165" rx="14" fill="#173368"/><text x="95" y="635" fill="white">03 与计量、切换和整机控制协同</text><text x="95" y="683" font-size="23" fill="#d7e4ed">图中 EA 泵、切换阀、针与汇流块承担其他任务；不可全部归为隔膜泵定量加液。</text><text x="95" y="724" font-size="23" fill="#d7e4ed">候选产品关联仅供选型，不代表图中设备已完成相应型号的装机验证。</text></g>
</g></svg>