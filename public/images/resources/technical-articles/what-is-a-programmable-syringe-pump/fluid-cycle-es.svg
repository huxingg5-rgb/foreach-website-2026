<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" role="img" xml:lang="es">
<title>Dirección del líquido entre fuente, válvula, jeringa y recipiente durante aspiración y dispensación</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#202020"/></marker></defs><rect width="800" height="540" fill="white"/>
<g font-family="Arial, Microsoft YaHei, Malgun Gothic, sans-serif" fill="#181818"><path d="M400 20V465" stroke="#bbb"/>
<text x="200" y="46" text-anchor="middle" font-size="36" font-weight="bold">01  Aspirar</text>
<text x="200" y="82" text-anchor="middle" font-size="26">Fuente → jeringa</text>
<rect x="35" y="110" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="157" text-anchor="middle" font-size="34">Fuente</text>
<path d="M200 193V227" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="242" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="289" text-anchor="middle" font-size="34">Válvula selectora</text>
<path d="M200 325V359" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="35" y="374" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="200" y="421" text-anchor="middle" font-size="34">Jeringa</text>
<text x="600" y="46" text-anchor="middle" font-size="36" font-weight="bold">02  Dispensar</text>
<text x="600" y="82" text-anchor="middle" font-size="26">Jeringa → destino</text>
<rect x="435" y="110" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="600" y="157" text-anchor="middle" font-size="34">Jeringa</text>
<path d="M600 193V227" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="435" y="242" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="600" y="289" text-anchor="middle" font-size="34">Válvula selectora</text>
<path d="M600 325V359" fill="none" stroke="#202020" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="435" y="374" width="330" height="70" rx="4" fill="white" stroke="#202020" stroke-width="2.5"/>
<text x="600" y="421" text-anchor="middle" font-size="34">Destino</text>
<path d="M35 480H765" stroke="#bbb"/><text x="400" y="520" text-anchor="middle" font-size="30">Establecer la vía antes de dosificar</text></g></svg>