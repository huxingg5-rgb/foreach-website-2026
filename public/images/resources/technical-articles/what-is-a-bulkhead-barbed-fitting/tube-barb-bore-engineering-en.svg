<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">PMB-U28-24D-PP-N tubing and fitting dimensions</title>
  <desc id="desc">Engineering schematic: tube inside diameter before assembly 2.4 mm, maximum barb outside diameter 3.5 mm and fitting bore diameter 1.7 mm. Dimensions are named directly. Centerlines, section hatching and dimension lines identify axes, solid material and measurement locations. Not to scale or for manufacture.</desc>
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 9L9 0M7 11L11 7" stroke="#111" stroke-width=".7"/></pattern>
    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 4L0 8Z" fill="#111"/></marker>
  </defs>
  <rect width="900" height="700" fill="#fff"/>
  <g font-family="Arial,Microsoft YaHei,sans-serif" fill="#111">
    <text x="24" y="42" font-size="29" font-weight="700">Tubing and fitting dimensions</text>
    <text x="24" y="76" font-size="22">PMB-U28-24D-PP-N</text>
    <text x="876" y="76" text-anchor="end" font-size="20">Units: mm | Schematic, not for manufacture</text>
    <path d="M24 96H876M300 112V432M24 451H876" fill="none" stroke="#111" stroke-width="1.2"/>
    <text x="160" y="141" text-anchor="middle" font-size="20">Unassembled tube section</text>
    <circle cx="160" cy="265" r="78" fill="url(#hatch)" stroke="#111" stroke-width="2.5"/>
    <circle cx="160" cy="265" r="48" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <path d="M52 265H268M160 158V371" fill="none" stroke="#111" stroke-width=".9" stroke-dasharray="18 4 3 4"/>
    <path d="M113 265H207" fill="none" stroke="#111" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="112" y="225" width="96" height="28" fill="#fff"/>
    <text x="160" y="247" text-anchor="middle" font-size="22">⌀2.4</text>
    <text x="160" y="396" text-anchor="middle" font-size="19">Tube inside diameter: 2.4 mm</text>
    <text x="160" y="426" text-anchor="middle" font-size="12">Outside diameter and wall thickness unspecified</text>
    <text x="590" y="141" text-anchor="middle" font-size="23">Barb and bore: partial section</text>
    <path d="M350 230L535 205V225H665V241H350ZM350 320L535 345V325H665V309H350Z" fill="url(#hatch)" stroke="#111" stroke-width="2.5" stroke-linejoin="miter"/>
    <path d="M325 275H694" fill="none" stroke="#111" stroke-width=".9" stroke-dasharray="20 4 3 4"/>
    <path d="M535 205H735M535 345H735M665 241H835M665 309H835" fill="none" stroke="#111" stroke-width=".9"/>
    <path d="M720 207V343M820 243V307" fill="none" stroke="#111" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="750" y="275" text-anchor="middle" font-size="24" transform="rotate(-90 750 275)">⌀3.5</text>
    <text x="855" y="275" text-anchor="middle" font-size="23" transform="rotate(-90 855 275)">⌀1.7</text>
    <path d="M535 205L510 179H350M462 275L492 370H580" fill="none" stroke="#111" stroke-width="1.1"/>
    <text x="350" y="173" font-size="19">Maximum barb diameter: 3.5 mm</text>
    <text x="588" y="377" font-size="20">Internal bore: 1.7 mm</text>
    <text x="590" y="426" text-anchor="middle" font-size="19">The outside grips the tube; the bore carries fluid</text>
    <text x="24" y="490" font-size="23" font-weight="700">How to use these dimensions</text>
    <text x="24" y="528" font-size="22">1. Select tubing: this fitting matches a 2.4 mm tube inside diameter.</text>
    <text x="54" y="558" font-size="18">Tube outside diameter, wall thickness, material and hardness also affect fit.</text>
    <text x="24" y="594" font-size="22">2. Check the barb: its maximum diameter is 3.5 mm; the tube expands over it.</text>
    <text x="24" y="630" font-size="21">3. Check the 1.7 mm bore: assess pressure drop and delivery at the target flow.</text>
    <path d="M24 651H876" stroke="#111" stroke-width="1.2"/>
    <text x="24" y="681" font-size="18">Source: PMB-U28-24D-PP-N drawing; tube diameter from the product fit specification.</text>
  </g>
</svg>
