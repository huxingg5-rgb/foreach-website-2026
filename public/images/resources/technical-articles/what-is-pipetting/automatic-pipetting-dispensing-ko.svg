<svg xmlns="http://www.w3.org/2000/svg" width="680" height="166" viewBox="0 0 680 166" role="img"><title>분주 경로: 모터가 플런저를 전진시키면 시약이 전환 밸브와 고정 니들을 거쳐 반응 용기로 들어갑니다.</title><desc>분주: 시린지 → 전환 밸브 → 분주 니들 → 반응 용기. 시약병 분기는 닫혀 있으며 목표 부피는 100 µL입니다.</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Microsoft YaHei, Malgun Gothic, sans-serif"><rect x="14" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="84.25" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="84.25" dy="0">시린지</tspan></text><text x="84.25" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="84.25" dy="0">플런저 전진</tspan></text><path d="M 159.5 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 172.5 77 l 8 5 -8 5" fill="#333"/><rect x="184.5" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="254.75" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="254.75" dy="0">전환 밸브</tspan></text><text x="254.75" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="254.75" dy="0">분주 경로 연결</tspan></text><path d="M 330 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 343 77 l 8 5 -8 5" fill="#333"/><rect x="355" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="425.25" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="425.25" dy="0">분주 니들</tspan></text><text x="425.25" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="425.25" dy="0">고정 위치</tspan></text><path d="M 500.5 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 513.5 77 l 8 5 -8 5" fill="#333"/><rect x="525.5" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="595.75" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle">