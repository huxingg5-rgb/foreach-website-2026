<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" lang="ko" aria-labelledby="title description"><title id="title">Modbus RTU와 ASCII의 직렬 유니캐스트 요청·응답 흐름, 메시지 필드와 주요 16진수 기능 코드</title><desc id="description">정상 응답을 반환하는 직렬 유니캐스트 통신과 주요 Modbus 기능 코드. RTU는 CRC, ASCII는 LRC를 사용합니다. 브로드캐스트 요청에는 응답하지 않습니다. TCP 형식은 위 표를 참고하십시오.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#238b96"/></marker></defs><rect width="1200" height="1030" fill="#ffffff"/><g font-family="Arial, 'Malgun Gothic', sans-serif"><text x="600" y="53" text-anchor="middle" fill="#203b60" font-size="34" font-weight="700"><tspan x="600" dy="0">Modbus RTU / ASCII</tspan></text><text x="600" y="93" text-anchor="middle" fill="#203b60" font-size="23" font-weight="400"><tspan x="600" dy="0">정상 응답을 반환하는 직렬 유니캐스트 통신</tspan></text><text x="250" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="250" dy="0">제어기 요청 메시지</tspan></text><rect x="40" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">장치 주소</tspan></text><rect x="40" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">기능 코드</tspan></text><rect x="40" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">데이터</tspan></text><rect x="40" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="456.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">CRC (RTU) / LRC (ASCII)</tspan></text><text x="950" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="950" dy="0">장치 응답 메시지</tspan></text><rect x="740" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">장치 주소</tspan></text><rect x="740" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">기능 코드</tspan></text><rect x="740" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">데이터</tspan></text><rect x="740" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="456.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">CRC (RTU) / LRC (ASCII)</tspan></text><text x="600" y="224" text-anchor="middle" fill="#237c88" font-size="24" font-weight="700"><tspan x="600" dy="0">요청</tspan></text><path d="M480 250 H714" fill="none" stroke="#238b96" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="368" text-anchor="middle" fill="#237c88" font-size="24" font-weight="700"><tspan x="600" dy="0">응답</tspan></text><path d="M720 394 H486" fill="none" stroke="#238b96" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="555" text-anchor="start" fill="#203b60" font-size="28" font-weight="700"><tspan x="40" dy="0">주요 기능 코드(16진수)</tspan></text><rect x="40" y="584" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="122" y1="584" x2="122" y2="672" stroke="#b6c4d3"/><text x="81" y="638" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">01</tspan></text><text x="140" y="637" text-anchor="start" fill="