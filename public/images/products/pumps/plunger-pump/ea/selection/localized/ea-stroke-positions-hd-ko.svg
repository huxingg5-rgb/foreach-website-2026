<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2250" viewBox="0 0 1500 1125">
<title>EA 배선 / 스트로크 참조</title>
<desc>A: 상부 기계적 한계점, B: 광센서 신호 전환점, C: 전체 스트로크 정수 스텝 위치, D: 하부 기계적 한계점. AB와 CD는 빨간색 끝단 영역이며 BC는 파란색 작동 영역입니다.</desc>
<rect width="1500" height="1125" fill="white"/>
