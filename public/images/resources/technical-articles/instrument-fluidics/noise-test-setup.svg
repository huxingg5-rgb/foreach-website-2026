<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><rect width="1440" height="900" fill="#f4f8fb"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#126c83" stroke-width="1.5"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#173368">
<text x="70" y="85" font-size="38" font-weight="700">隔膜泵噪音测试布置</text><text x="70" y="132" font-size="24" fill="#566b80">示意图 / 非实测现场 / 不按比例</text>
<rect x="1020" y="50" width="340" height="55" rx="8" fill="#fff1da"/><text x="1045" y="86" font-size="23" fill="#825b19">实测数据与视频待补</text>
<rect x="70" y="215" width="280" height="170" rx="12" fill="white" stroke="#c2d4e3" stroke-width="2"/><text x="105" y="265" font-size="28">介质与入口条件</text><text x="105" y="315" font-size="23" fill="#566b80">液位 / 压力 / 温度</text><text x="105" y="350" font-size="23" fill="#566b80">记录实际测试配置</text>
<path d="M350 300H465" fill="none" stroke="#126c83" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="500" y="220" width="340" height="165" rx="24" fill="#173368"/><circle cx="570" cy="300" r="48" fill="#e8f5f6"/><path d="M536 300Q570 260 604 300Q570 340 536 300" fill="none" stroke="#126c83" stroke-width="4"/><text x="645" y="290" font-size="28" fill="white">隔膜泵</text><text x="630" y="337" font-size="22" fill="#c8e7ec">完整型号待记录</text>
<rect x="535" y="385" width="50" height="32" rx="8" fill="#00bda0"/><rect x="755" y="385" width="50" height="32" rx="8" fill="#00bda0"/><rect x="460" y="417" width="410" height="24" fill="#8a9cad"/><text x="540" y="480" font-size="24">安装方式与隔振支撑</text>
<path d="M840 300H970" fill="none" stroke="#126c83" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1000" y="215" width="350" height="170" rx="12" fill="white" stroke="#c2d4e3" stroke-width="2"/><text x="1040" y="265" font-size="28">实际液路负载</text><text x="1040" y="315" font-size="23" fill="#566b80">出口压力 / 实际流量</text><text x="1040" y="350" font-size="23" fill="#566b80">阀门与动作节拍</text>
<path d="M665 510V605H990" fill="none" stroke="#8a9cad" stroke-dasharray="9 7" stroke-width="3"/><text x="690" y="575" font-size="23">固定测点与距离，写入测试记录</text>
<rect x="1040" y="490" width="250" height="175" rx="18" fill="#dbe6ee" stroke="#8a9cad" stroke-width="2"/><circle cx="1165" cy="470" r="20" fill="#173368"/><rect x="1070" y="520" width="190" height="70" fill="white"/><text x="1125" y="566" font-size="30">待测</text><text x="1110" y="633" font-size="25">声级计</text>
<rect x="70" y="715" width="1280" height="115" rx="12" fill="white"/><text x="100" y="758" font-size="25">记录顺序：停泵背景 → 启动 → 稳态运行 → 实际动作周期</text><text x="100" y="802" font-size="23" fill="#566b80">结果须同时包含型号、工作点、计权与统计指标；图中没有实测分贝值。</text>
</g></svg>