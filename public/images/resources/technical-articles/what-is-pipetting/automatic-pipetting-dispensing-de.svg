<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="680" height="166" viewBox="0 0 680 166"><title>Dosierweg: Der Motor schiebt den Spritzenkolben vor und fördert Reagenz über das Umschaltventil und die ortsfeste Nadel in das Reaktionsgefäß.</title><rect width="100%" height="100%" fill="white"/><rect x="10" y="43" width="145" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="82.5" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Spritze</text><text x="82.5" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Kolben fährt vor</text><path d="M 154 82 h 14 m -2 -5 v 10 l 9 -5 z" stroke="#444" fill="#444"/><rect x="175" y="43" width="145" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="247.5" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Umschaltventil</text><text x="247.5" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Auslass verbunden</text><path d="M 319 82 h 14 m -2 -5 v 10 l 9 -5 z" stroke="#444" fill="#444"/><rect x="340" y="43" width="145" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="412.5" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Dosiernadel</text><text x="412.5" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Ortsfest</text><path d="M 484 82 h 14 m -2 -5 v 10 l 9 -5 z" stroke="#444" fill="#444"/><rect x="505" y="43" width="145" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="577.5" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Reaktionsgefäß</text><text x="577.5" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Nimmt Reagenz auf</text></svg>
