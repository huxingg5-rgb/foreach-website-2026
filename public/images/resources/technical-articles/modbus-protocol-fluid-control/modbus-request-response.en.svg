<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" lang="en" aria-labelledby="title description"><title id="title">Modbus RTU and ASCII serial unicast request–response diagram, message fields and common hexadecimal function codes</title><desc id="description">Normal serial unicast exchange and common Modbus function codes. RTU uses CRC; ASCII uses LRC. Broadcast requests receive no response. The table above gives the TCP format.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#238b96"/></marker></defs><rect width="1200" height="1030" fill="#ffffff"/><g font-family="Arial, 'Malgun Gothic', sans-serif"><text x="600" y="53" text-anchor="middle" fill="#203b60" font-size="34" font-weight="700"><tspan x="600" dy="0">Modbus RTU / ASCII</tspan></text><text x="600" y="93" text-anchor="middle" fill="#203b60" font-size="23" font-weight="400"><tspan x="600" dy="0">Normal serial unicast request–response exchange</tspan></text><text x="250" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="250" dy="0">Controller request</tspan></text><rect x="40" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Device address</tspan></text><rect x="40" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Function code</tspan></text><rect x="40" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Data</tspan></text><rect x="40" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" s