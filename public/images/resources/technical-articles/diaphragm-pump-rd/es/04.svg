<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc" lang="es">
<title id="title">Volumen acumulado después de parar</title>
<desc id="desc">Esquema conceptual: una meseta puede indicar liberación de un volumen finito; un aumento continuo requiere comprobar la presión motriz restante. Registre el flujo inverso por separado.</desc>
