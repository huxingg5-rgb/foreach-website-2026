<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img"><title>द्रव मार्ग और दाब सीमाएँ तय करें</title><rect width="1400" height="620" rx="24" fill="#f3f8fb"/><g font-family="Arial, Noto Sans, Microsoft YaHei, Malgun Gothic, sans-serif"><text x="66" y="78" font-size="36" fill="#17354a" >द्रव मार्ग और दाब सीमाएँ तय करें</text><text x="66" y="125" font-size="23" fill="#536f80" >20 °C पर पानी · 60 mL/min · 1 m सीधी ट्यूब</text><line x1="170" y1="280" x2="1220" y2="280" stroke="#16859a" stroke-width="10"/><rect x="75" y="232" width="210" height="96" rx="16" fill="#17354a" stroke="#16859a" stroke-width="3"/><text x="180" y="288" font-size="25" fill="#ffffff" text-anchor="middle">पंप</text><rect x="420" y="232" width="210" height="96" rx="16" fill="#ffffff" stroke="#16859a" stroke-width="3"/><text x="525" y="288" font-size="25" fill="#17354a" text-anchor="middle">ट्यूब</text><rect x="760" y="232" width="210" height="96" rx="16" fill="#ffffff" stroke="#16859a" stroke-width="3"/><text x="865" y="288" font-size="25" fill="#17354a" text-anchor="middle">Cv वाला पुर्जा</text><rect x="1115" y="232" width="210" height="96" rx="16" fill="#ffffff" stroke="#16859a" stroke-width="3"/><text x="1220" y="288" font-size="25" fill="#17354a" text-anchor="middle">आउटलेट</text><text x="525" y="376" font-size="23" fill="#536f80" text-anchor="middle">ID 1 mm · L 1000 mm</text><text x="865" y="376" font-size="23" fill="#536f80" text-anchor="middle">Cv = 0.02</text><text x="66" y="192" font-size="22" fill="#536f80" >स्रोत का दाब और स्तर</text><text x="66" y="420" font-size="22" fill="#536f80" >पंप इनलेट की स्थितियाँ</text><text x="1334" y="192" font-size="22" fill="#536f80" text-anchor="end">आउटलेट का दाब और स्तर</text><line x1="405" y1="444" x2="975" y2="444" stroke="#16859a" stroke-width="3"/><text x="690" y="486" font-size="24" fill="#17354a" text-anchor="middle">दर्ज पुर्जों की गणना की गई दाब हानि</text><text x="66" y="565" font-size="24" fill="#536f80" >सीमाओं के दाब और स्थिर द्रव-दाब को अलग से जोड़ें।</text></g></svg>
