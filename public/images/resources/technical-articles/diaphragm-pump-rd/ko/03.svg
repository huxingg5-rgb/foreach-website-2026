<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">가진원에서 소리까지 전달 경로 추적</title><desc id="desc">가진원에서 소리까지 전달 경로 추적</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="1000" height="650" fill="white"/>
<text x="170" y="75" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="600" fill="#173368">가진원</text>
<text x="500" y="75" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="600" fill="#173368">전달 경로</text>
<text x="830" y="75" text-anchor="middle" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" font-weight="600" fill="#173368">소음 방사</text>
