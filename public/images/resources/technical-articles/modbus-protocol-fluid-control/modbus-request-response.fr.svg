<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" lang="fr" aria-labelledby="title description"><title id="title">Schéma des requêtes et réponses unicast Modbus RTU et ASCII, avec champs des messages et codes de fonction hexadécimaux courants</title><desc id="description">Échange série unicast avec réponse normale et codes de fonction Modbus courants. RTU utilise le CRC et ASCII le LRC. Les requêtes diffusées ne reçoivent aucune réponse. Le format TCP figure dans le tableau précédent.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#238b96"/></marker></defs><rect width="1200" height="1030" fill="#ffffff"/><g font-family="Arial, 'Malgun Gothic', sans-serif"><text x="600" y="53" text-anchor="middle" fill="#203b60" font-size="34" font-weight="700"><tspan x="600" dy="0">Modbus RTU / ASCII</tspan></text><text x="600" y="93" text-anchor="middle" fill="#203b60" font-size="23" font-weight="400"><tspan x="600" dy="0">Échange série unicast avec réponse normale</tspan></text><text x="250" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="250" dy="0">Requête du contrôleur</tspan></text><rect x="40" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Adresse de l’équipement</tspan></text><rect x="40" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Code de fonction</tspan></text><rect x="40" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Données</tspan></text><rect x="40" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="456.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">CRC (RTU) / LRC (ASCII)</tspan></text><text x="950" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="950" dy="0">Réponse de l’équipement</tspan></text><rect x="740" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">Adresse de l’équipement</tspan></text><rect x="740" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">Code de fonction</tspan></text><rect x="740" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">Données</tspan></text><rect x="740" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="456.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">CRC (RTU) / LRC (ASCII)</tspan></text><text x="600" y="224" text-anchor="middle" fill="#237c88" font-size="24" font-weight="700"><tspan x="600" dy="0">Requête</tspan></text><path d="M480 250 H714" fill="none" stroke="#238b96" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="368" text-anchor="middle" fill="#237c88" font-size="24" font-weight="700"><tspan x="600" dy="0">Réponse</tspan></text><path d="M720 394 H486" fill="none" stroke="#238b96" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="555" text-anchor="start" fill="#203b60" font-size="28" font-weight="700"><tspan x="40" dy="0">Codes de fonction courants (hex)</tspan></text><rect x="40" y="584" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="122" y1="584" x2="122" y2="672" stroke="#b6c4d3"/><text x="81" y="638" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">01</tspan></text><text x="140" y="637" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Lire les bobines</tspan></text><rect x="40" y="672" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="122" y1="672" x2="122" y2="760" stroke="#b6c4d3"/><text x="81" y="726" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">02</tspan></text><text x="140" y="725" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Lire les entrées discrètes</tspan></text><rect x="40" y="760" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="122" y1="760" x2="122" y2="848" stroke="#b6c4d3"/><text x="81" y="814" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">03</tspan></text><text x="140" y="813" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Lire les registres de maintien</tspan></text><rect x="40" y="848" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="122" y1="848" x2="122" y2="936" stroke="#b6c4d3"/><text x="81" y="902" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">04</tspan></text><text x="140" y="901" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Lire les registres d’entrée</tspan></text><rect x="620" y="584" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="702" y1="584" x2="702" y2="672" stroke="#b6c4d3"/><text x="661" y="638" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">05</tspan></text><text x="720" y="637" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">Écrire une bobine</tspan></text><rect x="620" y="672" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="702" y1="672" x2="702" y2="760" stroke="#b6c4d3"/><text x="661" y="726" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">06</tspan></text><text x="720" y="725" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">Écrire un registre</tspan></text><rect x="620" y="760" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="702" y1="760" x2="702" y2="848" stroke="#b6c4d3"/><text x="661" y="814" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">0F</tspan></text><text x="720" y="813" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">Écrire plusieurs bobines</tspan></text><rect x="620" y="848" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="702" y1="848" x2="702" y2="936" stroke="#b6c4d3"/><text x="661" y="902" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">10</tspan></text><text x="720" y="901" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="720" dy="0">Écrire plusieurs registres</tspan></text><text x="600" y="984" text-anchor="middle" fill="#5b6d81" font-size="20" font-weight="400"><tspan x="600" dy="0">RTU : CRC  •  ASCII : LRC  •  Les fonctions disponibles dépendent de l’équipement.</tspan></text></g></svg>
