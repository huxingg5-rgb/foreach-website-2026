<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="680" height="166" viewBox="0 0 680 166"><title>Ansaugweg: Der Motor zieht den Spritzenkolben zurück. Reagenz strömt aus der Flasche über das Umschaltventil in die Spritze.</title><rect width="100%" height="100%" fill="white"/><rect x="10" y="43" width="200" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="110" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Reagenzflasche</text><text x="110" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Flüssigkeitsquelle</text><path d="M 209 82 h 14 m -2 -5 v 10 l 9 -5 z" stroke="#444" fill="#444"/><rect x="230" y="43" width="200" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="330" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Umschaltventil</text><text x="330" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Einlass verbunden</text><path d="M 429 82 h 14 m -2 -5 v 10 l 9 -5 z" stroke="#444" fill="#444"/><rect x="450" y="43" width="200" height="80" rx="4" fill="white" stroke="#444" stroke-width="1.5"/><text x="550" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#171717" text-anchor="middle">Spritze</text><text x="550" y="103" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#555" text-anchor="middle">Kolben fährt zurück</text></svg>
