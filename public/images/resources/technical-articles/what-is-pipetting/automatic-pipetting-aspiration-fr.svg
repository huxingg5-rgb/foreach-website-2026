<svg xmlns="http://www.w3.org/2000/svg" width="680" height="166" viewBox="0 0 680 166" role="img"><title>Trajet d’aspiration : le moteur recule le piston et le réactif passe du flacon à la seringue par la vanne de commutation.</title><desc>Aspiration : flacon de réactif → vanne → seringue ; la branche de l’aiguille est fermée.</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Microsoft YaHei, Malgun Gothic, sans-serif"><rect x="14" y="22" width="197.33333333333334" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="112.66666666666667" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="112.66666666666667" dy="0">Flacon</tspan></text><text x="112.66666666666667" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="112.66666666666667" dy="0">Source de liquide</tspan></text><path d="M 216.33333333333334 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 229.33333333333334 77 l 8 5 -8 5" fill="#333"/><rect x="241.33333333333334" y="22" width="197.33333333333334" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="340" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="340" dy="0">Vanne</tspan></text><text x="340" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="340" dy="0">Entrée reliée</tspan></text><path d="M 443.6666666666667 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 456.6666666666667 77 l 8 5 -8 5" fill="#333"/><rect x="468.6666666666667" y="22" width="197.33333333333334" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="567.3333333333334" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="567.3333333333334" dy="0">Seringue</tspan></text><text x="567.3333333333334" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="567.3333333333334" dy="0">Recul du piston</tspan></text></g></svg>