<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">自吸启动的三个观察事件</title><desc id="desc">自吸启动的三个观察事件</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs><rect width="1000" height="650" fill="white"/>
<rect x="45" y="155" width="250" height="285" rx="10" fill="#f2f7fa" stroke="#a6b9c9" stroke-width="2"/>
<circle cx="170" cy="200" r="25" fill="white" stroke="#008b83" stroke-width="3"/>
<text x="170" y="209" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#173368">1</text>
<text x="170" y="275" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="600" fill="#173368">开始排气</text>
<text x="170" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#173368">隔膜往复运动，气体</text>
<text x="170" y="364" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#173368">逐步排出</text>
<rect x="375" y="155" width="250" height="285" rx="10" fill="#f2f7fa" stroke="#a6b9c9" stroke-width="2"/>
<circle cx="500" cy="200" r="25" fill="white" stroke="#008b83" stroke-width="3"/>
<text x="500" y="209" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#173368">2</text>
<text x="500" y="275" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="600" fill="#173368">首次见液</text>
<text x="500" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#173368">在指定观察点看到液</text>
<text x="500" y="364" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#173368">体</text>
<rect x="705" y="155" width="250" height="285" rx="10" fill="#f2f7fa" stroke="#a6b9c9" stroke-width="2"/>
<circle cx="830" cy="200" r="25" fill="white" stroke="#008b83" stroke-width="3"/>
<text x="830" y="209" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="25" font-weight="400" fill="#173368">3</text>
<text x="830" y="275" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="600" fill="#173368">末端稳定供液</text>
<text x="830" y="335" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#173368">出口流量或剂量达到</text>
<text x="830" y="364" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="22" font-weight="400" fill="#173368">验收条件</text>
<path d="M300,295 L365,295" fill="none" stroke="#008b83" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M630,295 L695,295" fill="none" stroke="#008b83" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="520" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="28" font-weight="400" fill="#173368">首次见液 ≠ 末端稳定供液</text>
<text x="500" y="580" text-anchor="middle" font-family="Microsoft YaHei,Arial,sans-serif" font-size="23" font-weight="400" fill="#64748b">事件顺序示意，不代表实测时间或产品性能</text>
</svg>