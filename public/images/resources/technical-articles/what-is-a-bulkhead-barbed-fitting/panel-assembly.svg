<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
 <title id="title">PMB U28 穿板倒刺接头装配位置</title>
 <desc id="desc">本体挡肩与螺母夹住面板，两侧软管套住倒刺，内部流道贯通。示意不按比例，无额外板面密封件。</desc>
