<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" lang="es" aria-labelledby="title description"><title id="title">Diagrama de solicitud y respuesta unicast de Modbus RTU y ASCII con campos del mensaje y códigos de función hexadecimales habituales</title><desc id="description">Intercambio serie unicast con respuesta normal y códigos de función Modbus habituales. RTU utiliza CRC y ASCII utiliza LRC. Las solicitudes por difusión no reciben respuesta. El formato TCP se indica en la tabla anterior.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#238b96"/></marker></defs><rect width="1200" height="1030" fill="#ffffff"/><g font-family="Arial, 'Malgun Gothic', sans-serif"><text x="600" y="53" text-anchor="middle" fill="#203b60" font-size="34" font-weight="700"><tspan x="600" dy="0">Modbus RTU / ASCII</tspan></text><text x="600" y="93" text-anchor="middle" fill="#203b60" font-size="23" font-weight="400"><tspan x="600" dy="0">Intercambio serie unicast con respuesta normal</tspan></text><text x="250" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="250" dy="0">Solicitud del controlador</tspan></text><rect x="40" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Dirección del dispositivo</tspan></text><rect x="40" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Código de función</tspan></text><rect x="40" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">Datos</tspan></text><rect x="40" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="250" y="456.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="250" dy="0">CRC (RTU) / LRC (ASCII)</tspan></text><text x="950" y="150" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="950" dy="0">Respuesta del dispositivo</tspan></text><rect x="740" y="180" width="420" height="65" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="221.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">Dirección del dispositivo</tspan></text><rect x="740" y="245" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="286.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">Código de función</tspan></text><rect x="740" y="310" width="420" height="105" fill="#ffffff" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="371.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">Datos</tspan></text><rect x="740" y="415" width="420" height="65" fill="#f3f7fb" stroke="#9bacc1" stroke-width="1.5"/><text x="950" y="456.5" text-anchor="middle" fill="#203b60" font-size="26" font-weight="400"><tspan x="950" dy="0">CRC (RTU) / LRC (ASCII)</tspan></text><text x="600" y="224" text-anchor="middle" fill="#237c88" font-size="24" font-weight="700"><tspan x="600" dy="0">Solicitud</tspan></text><path d="M480 250 H714" fill="none" stroke="#238b96" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="368" text-anchor="middle" fill="#237c88" font-size="24" font-weight="700"><tspan x="600" dy="0">Respuesta</tspan></text><path d="M720 394 H486" fill="none" stroke="#238b96" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="555" text-anchor="start" fill="#203b60" font-size="28" font-weight="700"><tspan x="40" dy="0">Códigos de función habituales (hex)</tspan></text><rect x="40" y="584" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="122" y1="584" x2="122" y2="672" stroke="#b6c4d3"/><text x="81" y="638" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">01</tspan></text><text x="140" y="637" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Leer bobinas</tspan></text><rect x="40" y="672" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="122" y1="672" x2="122" y2="760" stroke="#b6c4d3"/><text x="81" y="726" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">02</tspan></text><text x="140" y="725" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Leer entradas discretas</tspan></text><rect x="40" y="760" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="122" y1="760" x2="122" y2="848" stroke="#b6c4d3"/><text x="81" y="814" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">03</tspan></text><text x="140" y="813" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Leer registros de retención</tspan></text><rect x="40" y="848" width="540" height="88" fill="#ffffff" stroke="#b6c4d3"/><line x1="122" y1="848" x2="122" y2="936" stroke="#b6c4d3"/><text x="81" y="902" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="81" dy="0">04</tspan></text><text x="140" y="901" text-anchor="start" fill="#203b60" font-size="24" font-weight="400"><tspan x="140" dy="0">Leer registros de entrada</tspan></text><rect x="620" y="584" width="540" height="88" fill="#f3f7fb" stroke="#b6c4d3"/><line x1="702" y1="584" x2="702" y2="672" stroke="#b6c4d3"/><text x="661" y="638" text-anchor="middle" fill="#203b60" font-size="27" font-weight="700"><tspan x="661" dy="0">05</tspan></text><text x="720" y="637" text-anchor="start" fill="#