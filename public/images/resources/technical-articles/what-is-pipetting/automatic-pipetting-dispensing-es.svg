<svg xmlns="http://www.w3.org/2000/svg" width="680" height="166" viewBox="0 0 680 166" role="img"><title>Recorrido de dispensación: el motor avanza el émbolo y el reactivo pasa por la válvula y la aguja fija hasta el recipiente de reacción.</title><desc>Dispensación: jeringa → válvula → aguja → recipiente de reacción; la rama del frasco queda cerrada. Volumen objetivo: 100 µL.</desc><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, Microsoft YaHei, Malgun Gothic, sans-serif"><rect x="14" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="84.25" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="84.25" dy="0">Jeringa</tspan></text><text x="84.25" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="84.25" dy="0">Émbolo avanza</tspan></text><path d="M 159.5 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 172.5 77 l 8 5 -8 5" fill="#333"/><rect x="184.5" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="254.75" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="254.75" dy="0">Válvula</tspan></text><text x="254.75" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="254.75" dy="0">Salida</tspan><tspan x="254.75" dy="21.12">conectada</tspan></text><path d="M 330 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 343 77 l 8 5 -8 5" fill="#333"/><rect x="355" y="22" width="140.5" height="120" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="425.25" y="66" font-size="20" font-weight="600" fill="#171717" text-anchor="middle"><tspan x="425.25" dy="0">Aguja</tspan></text><text x="425.25" y="108" font-size="16" font-weight="400" fill="#575757" text-anchor="middle"><tspan x="425.25" dy="0">Posición fija</tspan></text><path d="M 500.5 82 h 17" stroke="#333" stroke-width="1.5"/><path d="M 513.5 77 l 8 5 -8 5" fill=